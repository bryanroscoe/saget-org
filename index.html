<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SAGET.ORG — Game server status and info.">
  <meta property="og:title" content="SAGET.ORG">
  <meta property="og:description" content="Game server status and info.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://saget.org">
  <title>SAGET.ORG</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,50 50,95 5,50' fill='%2300ffd5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-panel: #12121a;
      --bg-panel-sub: #181824;
      --neon: #00ffd5;
      --accent: #ff2d6b;
      --text-dim: #5a5a6e;
      --text-light: #9a9ab0;
      --font-display: 'Oxanium', sans-serif;
      --text-name: #d0d0dd;
      --font-mono: 'Share Tech Mono', monospace;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      color: var(--text-light);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      /* Grid pattern overlay */
      background-image:
        radial-gradient(ellipse 600px 400px at 50% 35%, rgba(0, 255, 213, 0.05) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(0, 255, 213, 0.03) 59px, rgba(0, 255, 213, 0.03) 60px),
        repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(0, 255, 213, 0.03) 59px, rgba(0, 255, 213, 0.03) 60px);
      background-attachment: fixed;
    }

    /* CRT scanline overlay */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      background: repeating-linear-gradient(
        0deg,
        transparent 0%,
        transparent 50%,
        rgba(0, 0, 0, 0.03) 50%,
        rgba(0, 0, 0, 0.03) 100%
      );
      background-size: 100% 4px;
    }

    /* ---- Hero ---- */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 40px;
      min-height: 50vh;
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(2.5rem, 7vw, 7rem);
      color: var(--neon);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 7px rgba(0, 255, 213, 0.8),
        0 0 15px rgba(0, 255, 213, 0.6),
        0 0 30px rgba(0, 255, 213, 0.4),
        0 0 50px rgba(0, 255, 213, 0.25),
        0 0 80px rgba(0, 255, 213, 0.15),
        0 0 120px rgba(0, 255, 213, 0.08);
      animation: flicker 6s ease-in-out infinite;
      user-select: none;
      text-align: center;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      65% { opacity: 1; }
      66% { opacity: 0.84; }
      67% { opacity: 0.92; }
      67.5% { opacity: 0.85; }
      69% { opacity: 1; }
      85% { opacity: 1; }
      85.5% { opacity: 0.9; }
      86% { opacity: 1; }
    }

    .hero-divider {
      width: min(500px, 80vw);
      height: 1px;
      margin-top: 28px;
      background: linear-gradient(90deg, transparent 0%, var(--neon) 30%, var(--neon) 70%, transparent 100%);
      opacity: 0.4;
    }

    /* ---- Server Status Panel ---- */
    .server-panel {
      width: 100%;
      max-width: 750px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .panel-header {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
      padding-left: 2px;
    }

    .server-card {
      background: var(--bg-panel);
      border: 1px solid rgba(0, 255, 213, 0.12);
      border-radius: 4px;
      margin-bottom: 12px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    .server-card:hover {
      border-color: rgba(0, 255, 213, 0.3);
      box-shadow: 0 0 20px rgba(0, 255, 213, 0.04), inset 0 0 20px rgba(0, 255, 213, 0.02);
    }

    .server-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .server-identity {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Status dots */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--neon);
      box-shadow: 0 0 6px var(--neon), 0 0 12px rgba(0, 255, 213, 0.4);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    .status-dot.offline {
      background: var(--accent);
      box-shadow: 0 0 4px rgba(255, 45, 107, 0.3);
    }

    .status-dot.unknown {
      background: var(--text-dim);
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }

    .server-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--text-name);
    }

    .game-badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-light);
      border: 1px solid rgba(138, 138, 154, 0.3);
      border-radius: 2px;
      padding: 1px 6px;
    }

    .server-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .server-address {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      color: var(--neon);
      opacity: 0.9;
      letter-spacing: 0.02em;
    }

    .player-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-light);
      background: rgba(0, 255, 213, 0.05);
      border: 1px solid rgba(0, 255, 213, 0.15);
      border-radius: 3px;
      padding: 2px 8px;
    }

    .expand-btn {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }

    .server-card.open .expand-btn {
      transform: rotate(180deg);
      color: var(--neon);
    }

    /* ---- Expandable Details Accordion ---- */
    .server-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease, padding 0.35s ease;
      background: var(--bg-panel-sub);
      border-top: 1px solid rgba(0, 255, 213, 0.05);
      padding: 0 18px;
    }

    .server-card.open .server-details {
      max-height: 300px;
      padding: 14px 18px 16px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px 24px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .detail-label {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .detail-val {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-val.highlight {
      color: var(--neon);
    }

    .player-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--neon);
      background: rgba(0, 255, 213, 0.08);
      border: 1px solid rgba(0, 255, 213, 0.2);
      border-radius: 3px;
      padding: 1px 6px;
      margin-right: 4px;
      margin-top: 2px;
    }

    .copy-btn {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      color: var(--neon);
      background: rgba(0, 255, 213, 0.08);
      border: 1px solid rgba(0, 255, 213, 0.25);
      border-radius: 2px;
      padding: 2px 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .copy-btn:hover {
      background: rgba(0, 255, 213, 0.2);
    }

    /* ---- Footer ---- */
    .footer {
      text-align: center;
      padding: 30px 20px 36px;
      border-top: 1px solid transparent;
      border-image: linear-gradient(90deg, transparent 0%, rgba(0, 255, 213, 0.15) 30%, rgba(0, 255, 213, 0.15) 70%, transparent 100%) 1;
    }

    .footer-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      .server-main { flex-direction: column; align-items: flex-start; gap: 8px; }
      .server-right { width: 100%; justify-content: space-between; margin-top: 4px; }
      .server-card { margin-bottom: 10px; }
      .hero { padding: 50px 16px 20px; }
    }
  </style>
</head>
<body>

  <main class="hero">
    <h1 class="logo">SAGET.ORG</h1>
    <div class="hero-divider"></div>
  </main>

  <section class="server-panel" id="server-panel">
    <h2 class="panel-header">Server Status</h2>
    <div id="server-list" class="server-list"></div>
  </section>

  <footer class="footer">
    <span class="footer-text">saget.org</span>
  </footer>

  <script>
    (function () {
      const ENDPOINTS = [
        'https://home.saget.org/status',
        'https://home.saget.org/status.json',
        'status.json'
      ];
      const REFRESH_INTERVAL = 15000;

      function esc(str) {
        const el = document.createElement('span');
        el.textContent = String(str);
        return el.innerHTML;
      }

      const panel = document.getElementById('server-panel');
      const container = document.getElementById('server-list');

      async function fetchStatus() {
        for (const url of ENDPOINTS) {
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 4000);
            const cacheBustUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
            const res = await fetch(cacheBustUrl, { signal: controller.signal, cache: 'no-store' });
            clearTimeout(timeout);
            if (res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.servers)) return data;
            }
          } catch (e) {}
        }
        throw new Error('All status endpoints unavailable');
      }

      window.copyText = function(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
          const orig = btn.textContent;
          btn.textContent = 'COPIED!';
          setTimeout(() => btn.textContent = orig, 1500);
        });
      };

      function render(data) {
        const servers = Array.isArray(data?.servers) ? data.servers : [];
        const visible = servers.filter(s => s.visible !== false);
        if (visible.length === 0) {
          panel.style.display = 'none';
          return;
        }
        panel.style.display = '';

        // Save current open states before re-rendering
        const openMap = {};
        container.querySelectorAll('.server-card').forEach(card => {
          if (card.classList.contains('open')) {
            openMap[card.getAttribute('data-id')] = true;
          }
        });

        container.innerHTML = visible.map((server, idx) => {
          const cardId = server.name || ('server-' + idx);
          const isOpen = openMap[cardId] || (idx === 0 && server.status === 'online');

          const lastCheckedTime = server.lastChecked ? new Date(server.lastChecked).getTime() : 0;
          const isStale = !lastCheckedTime || (Date.now() - lastCheckedTime > 24 * 60 * 60 * 1000);
          
          const isOnline = server.status === 'online';
          const statusClass = isOnline ? 'online' : 'offline';
          
          const playersCount = isOnline && server.players !== null && server.maxPlayers !== null
            ? `${server.players}/${server.maxPlayers}`
            : '0/0';

          const playerTags = Array.isArray(server.playerNames) && server.playerNames.length > 0
            ? server.playerNames.map(name => `<span class="player-tag">${esc(name)}</span>`).join('')
            : '<span style="opacity: 0.5;">None</span>';

          const checked = server.lastChecked
            ? new Date(server.lastChecked).toLocaleString()
            : 'Offline';

          const displayName = server.serverName || server.name;
          const fullAddr = `${server.address}:${server.port}`;

          return `
            <div class="server-card ${isOpen ? 'open' : ''}" data-id="${esc(cardId)}">
              <div class="server-main" onclick="this.parentElement.classList.toggle('open')">
                <div class="server-identity">
                  <span class="status-dot ${statusClass}"></span>
                  <span class="server-name">${esc(displayName)}</span>
                  <span class="game-badge">${esc(server.game)}</span>
                </div>
                <div class="server-right">
                  <span class="server-address">${esc(fullAddr)}</span>
                  <span class="player-pill">${esc(playersCount)}</span>
                  <button class="expand-btn" aria-label="Toggle details">▼</button>
                </div>
              </div>
              <div class="server-details">
                <div class="details-grid">
                  <div class="detail-item">
                    <span class="detail-label">Server Address</span>
                    <div class="detail-val highlight">
                      <span>${esc(fullAddr)}</span>
                      <button class="copy-btn" onclick="event.stopPropagation(); copyText('${esc(fullAddr)}', this)">COPY</button>
                    </div>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">Password</span>
                    <div class="detail-val highlight">
                      <span>the usual</span>
                      <button class="copy-btn" onclick="event.stopPropagation(); copyText('the usual', this)">COPY</button>
                    </div>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">Online Players (${esc(server.players || 0)})</span>
                    <div class="detail-val">${playerTags}</div>
                  </div>
                  <div class="detail-item">
                    <span class="detail-label">Last Checked</span>
                    <div class="detail-val">${esc(checked)}</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }

      async function refresh() {
        try {
          const data = await fetchStatus();
          render(data);
        } catch {
          // Keep state on error
        }
      }

      refresh();
      setInterval(refresh, REFRESH_INTERVAL);
    })();
  </script>

</body>
</html>
